<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Zen — layers</title>
  </head>
  <body>
    <div id="app"></div>
    <form class="keyboard-tester" aria-label="Test your keyboard" onsubmit="return false">
      <div class="tester-heading">
        <label for="keyboard-test">Test your keyboard</label>
        <button type="reset" aria-label="Clear test text">Clear</button>
      </div>
      <textarea id="keyboard-test" rows="2" placeholder="Click here and type…"
        spellcheck="false" autocapitalize="off" autocomplete="off"
        aria-describedby="keyboard-test-hint"></textarea>
      <p id="keyboard-test-hint">Actual keyboard input · text stays when switching views</p>
    </form>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
